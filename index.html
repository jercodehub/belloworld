<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>魚蛋接接樂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#090d18;display:grid;place-items:center;touch-action:none;font-family:'Microsoft JhengHei','PingFang TC',sans-serif}#game-container{position:relative;width:min(100vw,420px);height:min(100vh,calc(min(100vw,420px)*16/9));overflow:hidden;border-radius:14px;background:#101827;box-shadow:0 0 42px #ff8a4044}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;padding:12px;pointer-events:none;color:white;z-index:2;text-align:center}.board{display:inline-block;background:#090d18c9;border:1px solid #ffd16688;border-radius:14px;padding:7px 17px;text-shadow:0 2px 6px #000}.label{font-size:11px;color:#ffe4a3}.score{font-size:27px;font-weight:900;color:#ffd166}.stage{font-size:11px;color:#a8e6e2}.chips{display:flex;justify-content:center;gap:7px;margin-top:7px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 9px;border-radius:20px;background:#090d18bb;border:1px solid #ffffff33}.combo{color:#ff9e9e}.best{color:#ffe082}#float{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:4;color:white;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;opacity:0;pointer-events:none;white-space:nowrap}#start,#over{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;color:white;background:linear-gradient(#10172bef,#26140eef)}h1{font-size:34px;color:#ffd166;text-shadow:0 3px 14px #ff7b00;margin-bottom:5px}.sub{color:#ffe8b0;font-size:14px;margin-bottom:12px}.bestline{font-size:13px;color:#ffe082;margin-bottom:16px}.btn{border:0;border-radius:40px;padding:12px 38px;color:white;font-size:17px;font-weight:bold;background:linear-gradient(#ffad32,#db4b16);box-shadow:0 5px 20px #ff6d0080}.how{margin-top:17px;padding:12px 14px;border-radius:12px;background:#ffffff14;text-align:left;font-size:12px;line-height:1.7;max-width:310px;color:#eee}#over h2{color:#ff7676;font-size:29px}#final{font-size:38px;color:#ffd166;font-weight:900;margin:8px}#rank{color:#ffe082;margin:4px 0 18px}.hidden{display:none!important}
</style>
</head>
<body><div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="ui"><div class="board"><div class="label">魚蛋高度</div><div class="score"><span id="score">0</span><small style="font-size:12px"> cm</small></div><div class="stage" id="stage">街邊魚蛋檔</div></div><div class="chips"><div class="chip combo" id="combo">連擊 x0</div><div class="chip best" id="best">最高 0</div><div class="chip" id="effect" style="display:none"></div><button class="chip" id="pauseBtn" style="pointer-events:auto;cursor:pointer;border:1px solid #fff6;">暫停</button></div></div>
<div id="float"></div>
<div id="start"><h1>魚蛋接接樂</h1><div class="sub">喺香港街頭串起每一粒魚蛋！</div><div class="bestline" id="bestline">最高紀錄：0 cm</div><button class="btn" id="startBtn">開始遊戲</button><div class="how"><b>玩法</b><br>• 左右移動牙籤接魚蛋（手機拖動／鍵盤方向鍵）<br>• 金魚蛋、燒賣加分；辣魚蛋加速；凍魚蛋／蛋搾慢鏡<br>• 奶茶可暫時提高得分倍率；炸彈扣分斷連擊<br>• 堆太高會搖晃，小心唔好跌！漏接就 GAME OVER<br>• 按空白鍵或暫停按鈕可暫停</div></div>
<div id="over" class="hidden"><h2>魚蛋跌落地喇！</h2><div>今次串到</div><div id="final">0 cm</div><div id="rank"></div><button class="btn" id="again">再嚟過</button></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#gameCanvas'),ctx=canvas.getContext('2d'),container=document.querySelector('#game-container');
const $=s=>document.querySelector(s),ui={score:$('#score'),stage:$('#stage'),combo:$('#combo'),best:$('#best'),effect:$('#effect'),float:$('#float')};
let W=400,H=700,dpr=1,score=0,combo=0,maxCombo=0,best=0,running=false,gameOver=false,paused=false,lastTime=0,spawnTimer=0,balls=[],stack=[],px=200,targetX=200,dragging=false,slowTimer=0,fastTimer=0,floatTimer=0,stageIndex=0,multiTimer=0;
try{best=Number(localStorage.getItem('fishball_best'))||0}catch(e){}ui.best.textContent='最高 '+best;$('#bestline').textContent='最高紀錄：'+best+' cm';
const stages=[{at:0,name:'街邊魚蛋檔'},{at:12,name:'旺角夜街'},{at:28,name:'維多利亞港'}];
function resize(){const r=container.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.width=Math.round(r.width*dpr);H=canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';if(!running)px=targetX=W/2}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,100));resize();
function getStageIndex(){let n=0;for(let i=0;i<stages.length;i++)if(score>=stages[i].at)n=i;return n}
function text(s,x,y,size,color,align='center'){ctx.font=`bold ${Math.max(9,size*W)}px sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x*W,y*H)}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x*W,y*H,w*W,h*H,r*W);ctx.fill()}
function drawDaiPaiDang(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17213b');sky.addColorStop(.52,'#53404a');sky.addColorStop(1,'#211914');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 [[0,.37,.22],[.20,.29,.20],[.39,.40,.22],[.61,.31,.20],[.80,.36,.23]].forEach((b,j)=>{ctx.fillStyle=['#252b3b','#303341','#222b38'][j%3];ctx.fillRect(b[0]*W,(1-b[1])*H,b[2]*W,b[1]*H);for(let yy=(1-b[1])*H+8*dpr;yy<H*.56;yy+=14*dpr){ctx.fillStyle=(Math.floor(yy/dpr+j)%3)?'#f2c56b99':'#8ac6c688';for(let xx=b[0]*W+7*dpr;xx<(b[0]+b[2])*W-4*dpr;xx+=13*dpr)if(Math.floor(xx/dpr+yy/dpr)%3)ctx.fillRect(xx,yy,5*dpr,6*dpr)}});
 ctx.fillStyle='#eee4d0';ctx.fillRect(0,.57*H,W,.085*H);for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#f4ead8':'#c93632';ctx.fillRect(i*W/12,.57*H,W/12,.085*H)}
 ctx.fillStyle='#34251f';ctx.fillRect(.07*W,.66*H,.86*W,.25*H);ctx.fillStyle='#77858a';ctx.fillRect(.09*W,.68*H,.82*W,.025*H);ctx.fillStyle='#f3dfae';ctx.fillRect(.14*W,.70*H,.72*W,.13*H);text('咖喱魚蛋  $12',.5,.755,.033,'#60391f');text('熱辣辣・即串即食',.5,.805,.021,'#a23b22');
 ctx.fillStyle='#b8c2c3';ctx.beginPath();ctx.ellipse(.5*W,.895*H,.17*W,.035*H,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#59666b';ctx.fillRect(.34*W,.86*H,.32*W,.035*H);ctx.fillStyle='#d3ddda';ctx.beginPath();ctx.ellipse(.5*W,.86*H,.16*W,.025*H,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=2*dpr;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo((.44+i*.06)*W,.84*H);ctx.bezierCurveTo((.40+i*.06)*W,.81*H,(.49+i*.06)*W,.79*H,(.45+i*.06)*W,.76*H);ctx.stroke()}
}
function drawMongKok(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#090d22');sky.addColorStop(.55,'#252440');sky.addColorStop(1,'#131924');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 [[0,.55,.18],[.16,.44,.17],[.31,.61,.18],[.48,.47,.16],[.63,.58,.19],[.81,.45,.21]].forEach((b,j)=>{let top=(1-b[1])*H;ctx.fillStyle=['#252c3b','#302b3b','#202c39'][j%3];ctx.fillRect(b[0]*W,top,b[2]*W,b[1]*H);for(let yy=top+8*dpr;yy<H*.76;yy+=17*dpr)for(let xx=b[0]*W+5*dpr;xx<(b[0]+b[2])*W-4*dpr;xx+=11*dpr){ctx.fillStyle=(Math.floor(xx+yy+j)%3)?'#ffd67a99':'#6dcad077';ctx.fillRect(xx,yy,4*dpr,7*dpr)}});
 const signs=[[.08,.39,'魚蛋粉','#ff3859'],[.27,.48,'茶餐廳','#44efbb'],[.50,.36,'燒味','#ffdc42'],[.71,.46,'奶茶','#ff62c0'],[.90,.40,'涼茶','#36d6ff']];signs.forEach(a=>{ctx.save();ctx.shadowColor=a[3];ctx.shadowBlur=12*dpr;rounded(a[0]-.055,.20,.11,.31,.008,'#111827e8');text(a[2],a[0],.31,.027,a[3]);ctx.restore()});
 ctx.fillStyle='#23252b';ctx.fillRect(0,.78*H,W,.22*H);for(let i=0;i<6;i++)ctx.fillStyle='#eee8d8',ctx.fillRect((.12+i*.14)*W,.91*H,.075*W,.018*H);
 rounded(.24,.79,.52,.085,.025,'#d7d9d7');rounded(.28,.80,.44,.05,.013,'#c63c3b');rounded(.37,.765,.27,.045,.012,'#a7d6e5');ctx.fillStyle='#141820';[.36,.65].forEach(a=>{ctx.beginPath();ctx.arc(a*W,.88*H,9*dpr,0,Math.PI*2);ctx.fill()});text('的士',.5,.795,.017,'#fff');text('旺角・夜市',.5,.965,.026,'#ffe7b0');
}
function drawHarbour(){
 const sky=ctx.createLinearGradient(0,0,0,H*.66);sky.addColorStop(0,'#111c42');sky.addColorStop(.64,'#6d5872');sky.addColorStop(1,'#ef9b70');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.64);
 const buildings=[[0,.25,.10],[.10,.35,.10],[.21,.29,.09],[.30,.46,.12],[.43,.34,.10],[.53,.52,.11],[.65,.38,.12],[.78,.30,.10],[.88,.43,.12]];
 buildings.forEach((b,j)=>{let top=(.64-b[1])*H,x=b[0]*W,w=b[2]*W;ctx.fillStyle=j%2?'#192a43':'#23314c';ctx.fillRect(x,top,w,b[1]*H);if(j===5){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+w*.5,top-18*dpr);ctx.lineTo(x+w,top);ctx.fill()}for(let yy=top+8*dpr;yy<H*.63;yy+=13*dpr)for(let xx=x+5*dpr;xx<x+w-3*dpr;xx+=10*dpr)if(Math.floor(xx+yy+j)%3)ctx.fillStyle='#ffd786aa',ctx.fillRect(xx,yy,4*dpr,5*dpr)});
 let water=ctx.createLinearGradient(0,H*.63,0,H);water.addColorStop(0,'#17415a');water.addColorStop(1,'#0b1c31');ctx.fillStyle=water;ctx.fillRect(0,H*.63,W,H*.37);for(let i=0;i<48;i++){let xx=((i*79)%W),yy=(.66+(i%11)*.028)*H;ctx.fillStyle=i%3?'#ffc66a77':'#78dce077';ctx.fillRect(xx,yy,(9+(i%6)*5)*dpr,2*dpr)}
 ctx.fillStyle='#f4ebd4';ctx.beginPath();ctx.moveTo(.35*W,.79*H);ctx.lineTo(.66*W,.79*H);ctx.lineTo(.61*W,.84*H);ctx.lineTo(.40*W,.84*H);ctx.closePath();ctx.fill();ctx.fillStyle='#326f6b';ctx.fillRect(.42*W,.75*H,.16*W,.04*H);ctx.fillStyle='#fff4d8';for(let i=0;i<4;i++)ctx.fillRect((.435+i*.035)*W,.76*H,.018*W,.018*H);ctx.fillStyle='#e7e2d6';ctx.fillRect(.48*W,.72*H,.045*W,.03*H);text('天星小輪',.5,.705,.018,'#fff0c7');text('維多利亞港',.5,.20,.032,'#ffe7c0');
}
function drawBackground(){stageIndex=getStageIndex();if(stageIndex===0)drawDaiPaiDang();else if(stageIndex===1)drawMongKok();else drawHarbour()}
function ballRadius(){return Math.max(17*dpr,W*.048)*Math.max(.78,1-Math.max(0,stack.length-20)*.008)}
function Fishball(type){this.type=type;this.r=ballRadius();this.x=this.r+Math.random()*(W-this.r*2);this.y=-this.r-24*dpr;this.v=H*(.20+Math.random()*.08)/60*(1+Math.min(score,65)*.012);this.drift=score>=28?(Math.random()-.5)*1.5:0;this.seed=Math.random()*10000;this.rot=(Math.random()-.5)*.035;this.size=.94+Math.random()*.12}
function drawBall(b){const r=b.r*(b.size||1);const colors={normal:['#fff8df','#f7d99a','#d9974d','#8b451d'],gold:['#fffbd0','#ffe568','#efa600','#99520a'],spicy:['#ffe0d2','#ff7759','#dc321e','#761111'],frozen:['#effaff','#79d9ff','#178fc2','#104c80'],bomb:['#edf1f3','#91a3aa','#394b52','#17232b'],siu:['#fff5e6','#ffcc80','#e67e22','#8b4513'],tart:['#fff8e1','#ffeb3b','#f9a825','#e65100'],milk:['#fffde7','#fff59d','#ffc107','#ff6f00']};const p=colors[b.type]||colors.normal;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot||0);
 ctx.beginPath();ctx.ellipse(r*.13,r*.34,r*.91,r*.68,0,0,Math.PI*2);ctx.fillStyle='#120c0866';ctx.fill();
 const g=ctx.createRadialGradient(-r*.34,-r*.40,r*.03,r*.08,r*.10,r*1.12);g.addColorStop(0,p[0]);g.addColorStop(.22,p[1]);g.addColorStop(.66,p[2]);g.addColorStop(1,p[3]);ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor='#080b12aa';ctx.shadowBlur=r*.22;ctx.shadowOffsetY=r*.12;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.save();ctx.beginPath();ctx.arc(0,0,r*.96,0,Math.PI*2);ctx.clip();for(let i=0;i<22;i++){let a=(i*2.399+b.seed)%6.283,rad=r*(.18+((i*37+b.seed)%68)/100),sx=Math.cos(a)*rad,sy=Math.sin(a)*rad;if(sx*sx+sy*sy<r*r*.8){ctx.beginPath();ctx.ellipse(sx,sy,Math.max(1.2*dpr,r*(.018+(i%3)*.008)),Math.max(1*dpr,r*.014),a,0,Math.PI*2);ctx.fillStyle=i%4===0?'#fff0c977':'#713b2055';ctx.fill()}}ctx.restore();
 ctx.beginPath();ctx.ellipse(-r*.31,-r*.38,r*.29,r*.16,-.55,0,Math.PI*2);ctx.fillStyle='#fffde6bb';ctx.fill();ctx.beginPath();ctx.ellipse(-r*.16,-r*.18,r*.10,r*.045,-.5,0,Math.PI*2);ctx.fillStyle='#ffffff99';ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.97,0,Math.PI*2);ctx.strokeStyle=b.type==='gold'?'#fff0a8':'#ffe3a377';ctx.lineWidth=Math.max(1.5*dpr,r*.035);ctx.stroke();
 if(b.type==='bomb'){ctx.fillStyle='#ff5a36';ctx.beginPath();ctx.arc(0,-r*.82,r*.12,0,Math.PI*2);ctx.fill()}ctx.restore()}
function spawnBall(){let types=['normal','normal','normal','normal','normal','gold','spicy','frozen','bomb','siu','tart','milk'];let type=score<8?(Math.random()<.1?'gold':'normal'):types[Math.floor(Math.random()*types.length)];balls.push(new Fishball(type))}
function showMessage(s,color='#fff'){ui.float.textContent=s;ui.float.style.color=color;ui.float.style.opacity=1;floatTimer=.75}
function updateUI(){ui.score.textContent=score;const si=getStageIndex();ui.stage.textContent=stages[si].name;ui.combo.textContent='連擊 x'+combo;ui.best.textContent='最高 '+best;if(score>best){best=score;try{localStorage.setItem('fishball_best',String(best))}catch(e){}ui.best.textContent='最高 '+best}}
function finish(){running=false;gameOver=true;$('#final').textContent=score+' cm';$('#rank').textContent='最高連擊 x'+maxCombo+'　·　'+stages[getStageIndex()].name;$('#over').classList.remove('hidden')}
function start(){score=0;combo=0;maxCombo=0;balls=[];stack=[];spawnTimer=0;slowTimer=0;fastTimer=0;running=true;gameOver=false;px=targetX=W/2;ui.float.style.opacity=0;$('#start').classList.add('hidden');$('#over').classList.add('hidden');updateUI()}
function catchBall(b,dist){if(b.type==='bomb'){combo=0;score=Math.max(0,score-2);showMessage('炸彈！ -2','#ff8a80')}else{stack.push(b);combo++;maxCombo=Math.max(maxCombo,combo);let gain=b.type==='gold'||b.type==='siu'?3:1;const perfect=dist<b.r*.45;if(perfect)gain++;let mult=combo>=15?2:combo>=10?1.5:combo>=5?1.25:1;if(multiTimer>0)mult*=1.5;gain=Math.round(gain*mult);score+=gain;if(b.type==='spicy'){fastTimer=3.5;showMessage('辣！加速','#ff7b69')}else if(b.type==='frozen'||b.type==='tart'){slowTimer=3.5;showMessage(b.type==='tart'?'蛋搾！慢鏡':'凍！慢鏡','#79d9ff')}else if(b.type==='milk'){multiTimer=4;showMessage('奶茶！倍率UP','#ffd54f')}else if(b.type==='gold')showMessage('金魚蛋！ +'+gain,'#ffe082');else if(b.type==='siu')showMessage('燒賣！ +'+gain,'#ffcc80');else showMessage(perfect?'完美！ +'+gain:'好嘢！ +'+gain,perfect?'#fff59d':'#fff')}updateUI()}
function update(dt){if(!running||paused)return;if(slowTimer>0)slowTimer=Math.max(0,slowTimer-dt);if(fastTimer>0)fastTimer=Math.max(0,fastTimer-dt);if(multiTimer>0)multiTimer=Math.max(0,multiTimer-dt);if(floatTimer>0){floatTimer-=dt;if(floatTimer<=0)ui.float.style.opacity=0}ui.effect.style.display=slowTimer>0||fastTimer>0||multiTimer>0?'block':'none';ui.effect.textContent=slowTimer>0?'慢鏡 '+slowTimer.toFixed(1)+'s':fastTimer>0?'加速 '+fastTimer.toFixed(1)+'s':multiTimer>0?'倍率 '+multiTimer.toFixed(1)+'s':'';
 px+=(targetX-px)*Math.min(1,dt*12);spawnTimer+=dt*(fastTimer>0?1.15:1);let interval=Math.max(.48,1.7-score*.008);if(spawnTimer>=interval){spawnTimer=0;spawnBall()}
 const tipY=H*.62;for(let i=balls.length-1;i>=0;i--){let b=balls[i];b.y+=b.v*dt*60*(slowTimer>0?.55:1)*(fastTimer>0?1.3:1);b.x+=b.drift*dt*60;b.rot+=.025;if(b.x<b.r||b.x>W-b.r)b.drift*=-.7;const dist=Math.hypot(b.x-px,b.y-tipY);if(dist<b.r+20*dpr){balls.splice(i,1);catchBall(b,dist)}else if(b.y-b.r>H+30){finish();break}}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);drawBackground();balls.forEach(drawBall);const tipY=H*.62;ctx.save();ctx.lineCap='round';ctx.strokeStyle='#68452e';ctx.lineWidth=Math.max(6*dpr,W*.014);ctx.beginPath();ctx.moveTo(px,H*.93);ctx.lineTo(px,tipY);ctx.stroke();ctx.strokeStyle='#d9b786';ctx.lineWidth=Math.max(2*dpr,W*.004);ctx.beginPath();ctx.moveTo(px-2*dpr,H*.90);ctx.lineTo(px-2*dpr,tipY);ctx.stroke();ctx.strokeStyle='#ffe9be';ctx.lineWidth=2*dpr;ctx.beginPath();ctx.moveTo(px,tipY);ctx.lineTo(px,tipY-13*dpr);ctx.stroke();stack.forEach((b,i)=>{const sway=Math.sin(performance.now()/320+i*0.7)*(Math.min(i,25)*0.6*dpr);drawBall({type:b.type,r:ballRadius()*.88,x:px+sway,y:tipY+(i+.62)*ballRadius()*1.25,seed:b.seed,rot:Math.sin(performance.now()/400+i)*.025+sway*0.002,size:b.size})});ctx.restore()}
function loop(t){const dt=Math.min(.05,lastTime?(t-lastTime)/1000:0);lastTime=t;update(dt);draw();requestAnimationFrame(loop)}
function setPointer(e){const r=canvas.getBoundingClientRect();targetX=(e.clientX-r.left)*W/r.width}canvas.addEventListener('pointerdown',e=>{if(!running)return;dragging=true;setPointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging&&running)setPointer(e)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if((e.key===' '||e.key==='Enter')&&!running&&!gameOver)start();else if((e.key===' '||e.key==='Enter')&&gameOver)start()});addEventListener('keyup',e=>keys[e.key]=false);function keyLoop(){if(running){const step=W*.75/60;if(keys.ArrowLeft||keys.a||keys.A)targetX-=step;if(keys.ArrowRight||keys.d||keys.D)targetX+=step;targetX=Math.max(20*dpr,Math.min(W-20*dpr,targetX))}requestAnimationFrame(keyLoop)}
function togglePause(){if(!running||gameOver)return;paused=!paused;$('#pauseBtn').textContent=paused?'繼續':'暫停';if(paused)showMessage('暫停中','#ffe082');else ui.float.style.opacity=0;}
document.getElementById('pauseBtn').addEventListener('click',togglePause);
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Escape'){e.preventDefault();togglePause()}});
$('#startBtn').addEventListener('click',start);$('#again').addEventListener('click',start);requestAnimationFrame(loop);requestAnimationFrame(keyLoop);
})();
</script></body></html>
