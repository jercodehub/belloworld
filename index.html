<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魚蛋接接樂 | Fish Ball Catcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body {
      background:#0a0a0a; display:flex; justify-content:center; align-items:center;
      min-height:100vh; font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
      overflow:hidden; touch-action:none;
    }
    #game-container {
      position:relative; width:100%; max-width:420px; aspect-ratio:9/16;
      background:#000; border-radius:14px; overflow:hidden;
      box-shadow:0 0 50px rgba(255,120,40,0.25);
    }
    canvas { display:block; width:100%; height:100%; }
    #ui-layer {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; padding:14px; z-index:10;
    }
    .score-board {
      background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); border-radius:14px;
      padding:10px 16px; color:#fff; text-align:center;
      border:2px solid rgba(255,190,50,0.45); width:fit-content; margin:0 auto;
    }
    .score-board .label { font-size:12px; opacity:0.85; }
    .score-board .value {
      font-size:30px; font-weight:900; color:#ffd54f;
      text-shadow:0 2px 10px rgba(255,180,0,0.5); line-height:1.15;
    }
    .score-board .unit { font-size:13px; color:#ffecb3; }
    .height-info { font-size:12px; margin-top:3px; color:#9ee; opacity:0.95; }
    #start-screen, #gameover-screen {
      position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(25,12,5,0.94),rgba(45,18,5,0.96));
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      color:#fff; text-align:center; padding:24px; z-index:30; pointer-events:auto;
    }
    #start-screen h1 {
      font-size:40px; font-weight:900; color:#ffb300;
      text-shadow:0 4px 14px rgba(255,150,0,0.55); margin-bottom:6px; letter-spacing:2px;
    }
    #start-screen .subtitle { font-size:15px; color:#ffecb3; margin-bottom:26px; opacity:0.9; }
    .btn {
      background:linear-gradient(180deg,#ff9800,#e65100); color:#fff; border:none;
      padding:15px 46px; font-size:19px; font-weight:700; border-radius:50px; cursor:pointer;
      box-shadow:0 6px 22px rgba(255,100,0,0.5); font-family:inherit; letter-spacing:1px;
      transition:transform 0.12s;
    }
    .btn:active { transform:scale(0.96); }
    .howto {
      margin-top:28px; font-size:13.5px; line-height:1.7; color:#ddd; max-width:300px;
      background:rgba(255,255,255,0.07); padding:14px 18px; border-radius:12px;
    }
    #gameover-screen h2 {
      font-size:34px; color:#ff5252; margin-bottom:10px;
      text-shadow:0 0 18px rgba(255,50,50,0.45);
    }
    #gameover-screen .final-score { font-size:46px; font-weight:900; color:#ffd54f; margin:6px 0; }
    #gameover-screen .final-height { font-size:17px; color:#9ee; margin-bottom:26px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
      <div class="score-board">
        <div class="label">而家高度</div>
        <div class="value"><span id="scoreValue">0</span><span class="unit"> cm</span></div>
        <div class="height-info" id="heightDesc">香港小販攤檔</div>
      </div>
    </div>
    <div id="start-screen">
      <h1>魚蛋接接樂</h1>
      <div class="subtitle">用牙籤串住從天而降嘅魚蛋！</div>
      <button class="btn" id="startBtn">開始遊戲</button>
      <div class="howto">
        <strong>玩法：</strong><br>
        • 左右移動牙籤串住魚蛋<br>
        • 魚蛋會真係疊喺牙籤上，牙籤會伸長<br>
        • 每串一粒 +1cm，越高越難<br>
        • 漏接一粒就 GAME OVER<br>
        • 場景會一路向上變
      </div>
    </div>
    <div id="gameover-screen" class="hidden">
      <h2>魚蛋落地喇！</h2>
      <div>你串咗</div>
      <div class="final-score"><span id="finalScore">0</span> cm</div>
      <div class="final-height" id="finalHeight">到達：香港小販攤檔</div>
      <button class="btn" id="restartBtn">再嚟過</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const scoreValueEl = document.getElementById('scoreValue');
    const heightDescEl = document.getElementById('heightDesc');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHeightEl = document.getElementById('finalHeight');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W, H, dpr;
    let score = 0;
    let gameRunning = false;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let baseSpawnInterval = 1.5;
    let fallingBalls = [];
    let stackedBalls = [];
    let particles = [];
    let stickX = 0;
    let stickTargetX = 0;
    let isPointerDown = false;

    let transition = { active:false, progress:0, fromStage:null, toStage:null, duration:1.2 };
    let currentStageIndex = 0;

    const stages = [
      { min:0,   max:12,  name:'香港小販攤檔', key:'stall' },
      { min:12,  max:28,  name:'旺角霓虹街',   key:'mongkok' },
      { min:28,  max:50,  name:'維多利亞港',   key:'harbour' },
      { min:50,  max:78,  name:'中環天際線',   key:'skyline' },
      { min:78,  max:115, name:'高空雲層',     key:'clouds' },
      { min:115, max:165, name:'近地軌道',     key:'orbit' },
      { min:165, max:Infinity, name:'深空宇宙', key:'deepspace' }
    ];

    function getStageIndexByScore(s) {
      for (let i=0; i<stages.length; i++) {
        if (s >= stages[i].min && s < stages[i].max) return i;
      }
      return stages.length-1;
    }
    function getCurrentStage() { return stages[currentStageIndex]; }

    function getBallRadius() {
      const base = Math.max(20, W * 0.05);
      const mild = Math.max(0.72, 1 - Math.max(0, stackedBalls.length - 18) * 0.012);
      return base * mild;
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.floor(rect.width * dpr);
      H = Math.floor(rect.height * dpr);
      canvas.width = W; canvas.height = H;
      canvas.style.width = rect.width+'px';
      canvas.style.height = rect.height+'px';
      stickX = W/2; stickTargetX = W/2;
    }
    window.addEventListener('resize', resize);
    resize();

    function getPointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }
    canvas.addEventListener('pointerdown', e => { if(!gameRunning)return; isPointerDown=true; stickTargetX=getPointerX(e); });
    canvas.addEventListener('pointermove', e => { if(!gameRunning||!isPointerDown)return; stickTargetX=getPointerX(e); });
    canvas.addEventListener('pointerup', () => isPointerDown=false);
    canvas.addEvent
