<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魚蛋接接樂 | Fish Ball Catcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 100, 50, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .score-board {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 12px 18px;
      color: #fff;
      text-align: center;
      border: 2px solid rgba(255, 200, 50, 0.4);
    }

    .score-board .label {
      font-size: 13px;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    .score-board .value {
      font-size: 32px;
      font-weight: 900;
      color: #ffd54f;
      text-shadow: 0 2px 8px rgba(255, 180, 0, 0.5);
      line-height: 1.2;
    }

    .score-board .unit {
      font-size: 14px;
      color: #ffecb3;
    }

    .height-info {
      font-size: 12px;
      margin-top: 4px;
      color: #aee;
      opacity: 0.9;
    }

    #start-screen, #gameover-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,10,5,0.92), rgba(40,15,5,0.95));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 20;
      pointer-events: auto;
    }

    #start-screen h1 {
      font-size: 42px;
      font-weight: 900;
      color: #ffb300;
      text-shadow: 0 4px 12px rgba(255, 150, 0, 0.6);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #start-screen .subtitle {
      font-size: 16px;
      color: #ffecb3;
      margin-bottom: 28px;
      opacity: 0.9;
    }

    .btn {
      background: linear-gradient(180deg, #ff9800, #e65100);
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 100, 0, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
      letter-spacing: 1px;
    }

    .btn:active {
      transform: scale(0.96);
      box-shadow: 0 3px 10px rgba(255, 100, 0, 0.4);
    }

    .howto {
      margin-top: 32px;
      font-size: 14px;
      line-height: 1.7;
      color: #ddd;
      max-width: 300px;
      background: rgba(255,255,255,0.08);
      padding: 16px 20px;
      border-radius: 12px;
    }

    #gameover-screen h2 {
      font-size: 36px;
      color: #ff5252;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255, 50, 50, 0.5);
    }

    #gameover-screen .final-score {
      font-size: 48px;
      font-weight: 900;
      color: #ffd54f;
      margin: 8px 0;
    }

    #gameover-screen .final-height {
      font-size: 18px;
      color: #aee;
      margin-bottom: 28px;
    }

    .hidden {
      display: none !important;
    }

    #height-marker {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 3px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
      <div class="score-board">
        <div class="label">而家高度</div>
        <div class="value"><span id="scoreValue">0</span><span class="unit"> cm</span></div>
        <div class="height-info" id="heightDesc">小販攤檔門口</div>
      </div>
    </div>

    <div id="height-marker">↑ 越高越難 ↑</div>

    <div id="start-screen">
      <h1>魚蛋接接樂</h1>
      <div class="subtitle">用牙籤接住從天而降嘅魚蛋！</div>
      <button class="btn" id="startBtn">開始遊戲</button>
      <div class="howto">
        <strong>玩法：</strong><br>
        • 左右移動牙籤接住魚蛋<br>
        • 每接一粒 +1cm<br>
        • 魚蛋會越嚟越快<br>
        • 漏接一粒就 GAME OVER<br>
        • 高度會從攤檔 → 大樓 → 天空 → 太空
      </div>
    </div>

    <div id="gameover-screen" class="hidden">
      <h2>魚蛋落地喇！</h2>
      <div>你接咗</div>
      <div class="final-score"><span id="finalScore">0</span> cm</div>
      <div class="final-height" id="finalHeight">到達：小販攤檔</div>
      <button class="btn" id="restartBtn">再嚟過</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    const scoreValueEl = document.getElementById('scoreValue');
    const heightDescEl = document.getElementById('heightDesc');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHeightEl = document.getElementById('finalHeight');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W, H;
    let score = 0;
    let gameRunning = false;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let baseSpawnInterval = 1.4;
    let fishballs = [];
    let particles = [];
    let stickX = 0;
    let stickTargetX = 0;
    let isPointerDown = false;

    const stages = [
      { min: 0,   max: 15,  name: '小販攤檔門口', bg: 'street' },
      { min: 15,  max: 40,  name: '摩天大樓之間', bg: 'city' },
      { min: 40,  max: 80,  name: '高空雲層',     bg: 'sky' },
      { min: 80,  max: 150, name: '接近太空',     bg: 'space' },
      { min: 150, max: Infinity, name: '深空宇宙', bg: 'deepspace' }
    ];

    function getCurrentStage() {
      return stages.find(s => score >= s.min && score < s.max) || stages[stages.length - 1];
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      W = Math.floor(rect.width * (window.devicePixelRatio || 1));
      H = Math.floor(rect.height * (window.devicePixelRatio || 1));
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      stickX = W / 2;
      stickTargetX = W / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    function getPointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!gameRunning) return;
      isPointerDown = true;
      stickTargetX = getPointerX(e);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!gameRunning || !isPointerDown) return;
      stickTargetX = getPointerX(e);
    });
    canvas.addEventListener('pointerup', () => { isPointerDown = false; });
    canvas.addEventListener('pointerleave', () => { isPointerDown = false; });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      isPointerDown = true;
      stickTargetX = getPointerX(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      stickTargetX = getPointerX(e);
    }, { passive: false });
    canvas.addEventListener('touchend', () => { isPointerDown = false; });

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if ((e.key === ' ' || e.key === 'Enter') && !gameRunning && !gameOver) startGame();
      if ((e.key === ' ' || e.key === 'Enter') && gameOver) restartGame();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    class Fishball {
      constructor() {
        this.r = Math.max(18, W * 0.045);
        this.x = this.r + Math.random() * (W - this.r * 2);
        this.y = -this.r - 10;
        const speedFactor = 1 + score * 0.035;
        this.vy = (H * 0.35 + Math.random() * H * 0.15) * speedFactor / 60;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.12;
        this.caught = false;
        this.missed = false;
      }

      update(dt) {
        this.y += this.vy * dt * 60;
        this.rotation += this.rotSpeed;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.beginPath();
        ctx.ellipse(3, 4, this.r * 0.9, this.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();

        const grad = ctx.createRadialGradient(-this.r * 0.3, -this.r * 0.3, this.r * 0.1, 0, 0, this.r);
        grad.addColorStop(0, '#ffe082');
        grad.addColorStop(0.5, '#ffb74d');
        grad.addColorStop(0.85, '#e65100');
        grad.addColorStop(1, '#bf360c');
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-this.r * 0.28, -this.r * 0.28, this.r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,220,0.55)';
        ctx.fill();

        ctx.fillStyle = 'rgba(180,80,20,0.25)';
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 + 0.5;
          const d = this.r * 0.45;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * d, Math.sin(a) * d, this.r * 0.08, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8 - 2;
        this.life = 1;
        this.decay = 0.025 + Math.random() * 0.02;
        this.color = color;
        this.size = 3 + Math.random() * 5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function spawnFishball() {
      fishballs.push(new Fishball());
    }

    function createCatchParticles(x, y) {
      const colors = ['#ffb74d', '#ffd54f', '#ffe082', '#ff8a65', '#fff59d'];
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
      }
    }

    function drawStick() {
      const stickY = H - H * 0.12;
      const stickLen = H * 0.18;
      const stickW = Math.max(4, W * 0.012);

      stickX += (stickTargetX - stickX) * 0.28;

      ctx.save();
      ctx.translate(stickX, stickY);

      const stickGrad = ctx.createLinearGradient(-stickW, 0, stickW, 0);
      stickGrad.addColorStop(0, '#5d4037');
      stickGrad.addColorStop(0.4, '#a1887f');
      stickGrad.addColorStop(0.6, '#d7ccc8');
      stickGrad.addColorStop(1, '#5d4037');

      ctx.beginPath();
      ctx.moveTo(-stickW / 2, 0);
      ctx.lineTo(-stickW / 3, -stickLen);
      ctx.lineTo(stickW / 3, -stickLen);
      ctx.lineTo(stickW / 2, 0);
      ctx.closePath();
      ctx.fillStyle = stickGrad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-stickW / 3, -stickLen);
      ctx.lineTo(0, -stickLen - 12);
      ctx.lineTo(stickW / 3, -stickLen);
      ctx.closePath();
      ctx.fillStyle = '#8d6e63';
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(-stickW * 0.6, -8, stickW * 1.2, 14);

      ctx.restore();

      return { x: stickX, y: stickY - stickLen - 6, r: 18 };
    }

    function drawBackground(stage) {
      const t = Math.min(1, (score - stage.min) / Math.max(1, stage.max - stage.min));

      if (stage.bg === 'street') {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#3e2723');
        g.addColorStop(0.4, '#5d4037');
        g.addColorStop(0.7, '#795548');
        g.addColorStop(1, '#4e342e');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, H * 0.55, W, H * 0.45);

        ctx.fillStyle = '#c62828';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.55);
        for (let i = 0; i <= 8; i++) {
          const x = (i / 8) * W;
          const y = H * 0.55 + (i % 2 === 0 ? 18 : 0);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H * 0.7);
        ctx.lineTo(0, H * 0.7);
        ctx.closePath();
        ctx.fill();

        for (let i = 0; i < 5; i++) {
          const lx = W * (0.15 + i * 0.18);
          ctx.beginPath();
          ctx.arc(lx, H * 0.58, 8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 200, 50, 0.7)';
          ctx.fill();
        }
      } else if (stage.bg === 'city') {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0d1b2a');
        g.addColorStop(0.5, '#1b263b');
        g.addColorStop(1, '#415a77');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        const buildings = [
          [0.05, 0.45, 0.12], [0.18, 0.35, 0.1], [0.3, 0.5, 0.14],
          [0.46, 0.28, 0.11], [0.6, 0.42, 0.13], [0.75, 0.33, 0.1], [0.88, 0.48, 0.12]
        ];
        buildings.forEach(([bx, bh, bw]) => {
          const x = bx * W;
          const h = bh * H;
          const w = bw * W;
          ctx.fillStyle = `rgba(20, 30, 50, ${0.7 + t * 0.2})`;
          ctx.fillRect(x, H - h, w, h);
          ctx.fillStyle = 'rgba(255, 220, 100, 0.35)';
          for (let wy = H - h + 12; wy < H - 20; wy += 18) {
            for (let wx = x + 6; wx < x + w - 6; wx += 14) {
              if (Math.random() > 0.3) ctx.fillRect(wx, wy, 7, 9);
            }
          }
        });
      } else if (stage.bg === 'sky') {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0a1628');
        g.addColorStop(0.4, '#1a3a6e');
        g.addColorStop(0.8, '#4a90c4');
        g.addColorStop(1, '#87ceeb');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        drawCloud(W * 0.2, H * 0.3, 60);
        drawCloud(W * 0.7, H * 0.2, 80);
        drawCloud(W * 0.5, H * 0.55, 50);
      } else if (stage.bg === 'space' || stage.bg === 'deepspace') {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#000008');
        g.addColorStop(0.5, '#050520');
        g.addColorStop(1, '#0a0a30');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#fff';
        for (let i = 0; i < 80; i++) {
          const sx = (i * 97 % W);
          const sy = (i * 53 % H);
          const size = (i % 3 === 0) ? 1.5 : 0.8;
          ctx.globalAlpha = 0.4 + (i % 5) * 0.12;
          ctx.beginPath();
          ctx.arc(sx, sy, size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (stage.bg === 'deepspace') {
          const neb = ctx.createRadialGradient(W * 0.7, H * 0.3, 10, W * 0.7, H * 0.3, W * 0.4);
          neb.addColorStop(0, 'rgba(120, 40, 180, 0.25)');
          neb.addColorStop(1, 'transparent');
          ctx.fillStyle = neb;
          ctx.fillRect(0, 0, W, H);
        }
      }
    }

    function drawCloud(x, y, s) {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.5, 0, Math.PI * 2);
      ctx.arc(x + s * 0.4, y - s * 0.15, s * 0.4, 0, Math.PI * 2);
      ctx.arc(x + s * 0.7, y + s * 0.05, s * 0.35, 0, Math.PI * 2);
      ctx.arc(x - s * 0.3, y + s * 0.1, s * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    function checkCollision(ball, tip) {
      const dx = ball.x - tip.x;
      const dy = ball.y - tip.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist < ball.r + tip.r * 0.7;
    }

    function update(dt) {
      if (!gameRunning) return;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        stickTargetX = Math.max(30, stickTargetX - W * 0.025);
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        stickTargetX = Math.min(W - 30, stickTargetX + W * 0.025);
      }

      spawnTimer += dt;
      const interval = Math.max(0.45, baseSpawnInterval - score * 0.012);
      if (spawnTimer >= interval) {
        spawnTimer = 0;
        spawnFishball();
      }

      const tip = { x: stickX, y: H - H * 0.12 - H * 0.18 - 6, r: 18 };

      for (let i = fishballs.length - 1; i >= 0; i--) {
        const b = fishballs[i];
        b.update(dt);

        if (checkCollision(b, tip)) {
          score += 1;
          createCatchParticles(b.x, b.y);
          fishballs.splice(i, 1);
          updateUI();
          continue;
        }

        if (b.y - b.r > H) {
          endGame();
          return;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function updateUI() {
      scoreValueEl.textContent = score;
      const stage = getCurrentStage();
      heightDescEl.textContent = stage.name;
    }

    function draw() {
      const stage = getCurrentStage();
      drawBackground(stage);

      fishballs.forEach(b => b.draw(ctx));
      particles.forEach(p => p.draw(ctx));
      drawStick();

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H - H * 0.08);
      ctx.lineTo(W, H - H * 0.08);
      ctx.stroke();
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      score = 0;
      fishballs = [];
      particles = [];
      spawnTimer = 0;
      gameRunning = true;
      gameOver = false;
      stickX = W / 2;
      stickTargetX = W / 2;
      updateUI();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
      finalScoreEl.textContent = score;
      finalHeightEl.textContent = '到達：' + getCurrentStage().name;
      gameoverScreen.classList.remove('hidden');
    }

    function restartGame() {
      startGame();
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
