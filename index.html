<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bello</title>
  <style>
    body { background: #fef08a; text-align: center; padding-top: 100px; font-family: sans-serif; }
    button { padding: 20px 40px; font-size: 2rem; background: #fde047; border: 3px solid #ca8a04; border-radius: 50px; cursor: pointer; }
    .banana { position: absolute; top: -50px; font-size: 2rem; animation: fall 2s linear forwards; }
    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
  </style>
</head>
<body>
  <button onclick="rain()">Bello!</button>
  <script>
    function rain() {
      for(let i=0; i<20; i++) {
        let b = document.createElement('div');
        b.className = 'banana';
        b.innerText = '🍌';
        b.style.left = Math.random() * window.innerWidth + 'px';
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 2000);
      }
    }
  </script>
</body>
</html>
