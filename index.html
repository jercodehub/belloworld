<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>魚蛋接接樂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#090d18;display:grid;place-items:center;touch-action:none;font-family:'Microsoft JhengHei','PingFang TC',sans-serif}#game-container{position:relative;width:min(100vw,420px);height:min(100vh,calc(min(100vw,420px)*16/9));overflow:hidden;border-radius:14px;background:#101827;box-shadow:0 0 42px #ff8a4044}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;padding:12px;pointer-events:none;color:white;z-index:2;text-align:center}.board{display:inline-block;background:#090d18c9;border:1px solid #ffd16688;border-radius:14px;padding:7px 17px;text-shadow:0 2px 6px #000}.label{font-size:11px;color:#ffe4a3}.score{font-size:27px;font-weight:900;color:#ffd166}.stage{font-size:11px;color:#a8e6e2}.chips{display:flex;justify-content:center;gap:7px;margin-top:7px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 9px;border-radius:20px;background:#090d18bb;border:1px solid #ffffff33}.combo{color:#ff9e9e}.best{color:#ffe082}#float{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:4;color:white;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;opacity:0;pointer-events:none;white-space:nowrap}#start,#over{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;color:white;background:linear-gradient(#10172beF,#26140eeF)}h1{font-size:34px;color:#ffd166;text-shadow:0 3px 14px #ff7b00;margin-bottom:5px}.sub{color:#ffe8b0;font-size:14px;margin-bottom:12px}.bestline{font-size:13px;color:#ffe082;margin-bottom:16px}.btn{border:0;border-radius:40px;padding:12px 38px;color:white;font-size:17px;font-weight:bold;background:linear-gradient(#ffad32,#db4b16);box-shadow:0 5px 20px #ff6d0080}.how{margin-top:17px;padding:12px 14px;border-radius:12px;background:#ffffff14;text-align:left;font-size:12px;line-height:1.7;max-width:310px;color:#eee}#over h2{color:#ff7676;font-size:29px}#final{font-size:38px;color:#ffd166;font-weight:900;margin:8px}#rank{color:#ffe082;margin:4px 0 18px}.hidden{display:none!important}
</style>
</head><body><div id="game-container"><canvas id="gameCanvas"></canvas><div id="ui"><div class="board"><div class="label">魚蛋高度</div><div class="score"><span id="score">0</span><small style="font-size:12px"> cm</small></div><div class="stage" id="stage">香港夜市</div></div><div class="chips"><div class="chip combo" id="combo">連擊 x0</div><div class="chip best" id="best">最高 0</div><div class="chip" id="effect" style="display:none"></div></div></div><div id="float"></div><div id="start"><h1>魚蛋接接樂</h1><div class="sub">喺香港街頭串起每一粒魚蛋！</div><div class="bestline" id="bestline">最高紀錄：0 cm</div><button class="btn" id="startBtn">開始遊戲</button><div class="how"><b>玩法</b><br>• 左右移動牙籤接魚蛋，手機拖動／電腦用方向鍵<br>• 金魚蛋加分；辣魚蛋加速；凍魚蛋慢鏡<br>• 炸彈會扣分並中斷連擊；接得準有完美加分<br>• 魚蛋漏接就 GAME OVER</div></div><div id="over" class="hidden"><h2>魚蛋跌落地喇！</h2><div>今次串到</div><div id="final">0 cm</div><div id="rank"></div><button class="btn" id="again">再嚟過</button></div></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#gameCanvas'),x=c.getContext('2d'),box=document.querySelector('#game-container');
const $=s=>document.querySelector(s),ui={score:$('#score'),stage:$('#stage'),combo:$('#combo'),best:$('#best'),effect:$('#effect'),float:$('#float')};
let W=400,H=700,dpr=1,score=0,combo=0,maxCombo=0,best=0,running=false,over=false,last=0,spawn=0,balls=[],stack=[],bits=[],px=200,target=200,drag=false,slow=0,fast=0,floatT=0,stageNo=0;
try{best=+(localStorage.getItem('fishball_best')||0)}catch(e){}ui.best.textContent='最高 '+best;$('#bestline').textContent='最高紀錄：'+best+' cm';
const stages=[{at:0,name:'香港夜市'},{at:12,name:'旺角霓虹街'},{at:28,name:'維多利亞港'},{at:50,name:'中環天際線'},{at:78,name:'雲上香港'}];
function resize(){let r=box.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(r.width*dpr);H=c.height=Math.round(r.height*dpr);c.style.width=r.width+'px';c.style.height=r.height+'px';if(!running)px=target=W/2}addEventListener('resize',resize);resize();
function stageIndex(){let n=0;for(let i=0;i<stages.length;i++)if(score>=stages[i].at)n=i;return n}
function rr(a,b){x.beginPath();x.roundRect(a[0]*W,a[1]*H,a[2]*W,a[3]*H,b*W);x.fill()}
function text(t,a,b,size,color,align='center'){x.font=`bold ${Math.max(9,size*W)}px sans-serif`;x.textAlign=align;x.fillStyle=color;x.fillText(t,a*W,b*H)}
function skyline(){// densely packed Hong Kong tenements and neon signs
x.fillStyle=stageNo<2?'#11172d':'#081326';x.fillRect(0,0,W,H);
let buildings=[[0,.40,.19],[.16,.29,.15],[.29,.43,.18],[.46,.32,.16],[.60,.39,.18],[.77,.25,.13],[.88,.35,.18]];
buildings.forEach((b,j)=>{let top=H*(1-b[1]);x.fillStyle=['#192438','#263044','#172536'][j%3];x.fillRect(b[0]*W,top,b[2]*W,b[1]*H);x.fillStyle='#ffcb6b';for(let yy=top+10*dpr;yy<H-15*dpr;yy+=14*dpr)for(let xx=b[0]*W+6*dpr;xx<(b[0]+b[2])*W-3*dpr;xx+=11*dpr)if(Math.floor(xx+yy+j)%4)x.fillRect(xx,yy,4*dpr,6*dpr)});
// neon shop signs
const signs=[[.06,.39,'魚蛋','#ff466d'],[.30,.51,'茶餐廳','#44f0c1'],[.70,.43,'旺角','#ffd54f'],[.86,.55,'奶茶','#ff62c0']];signs.forEach(a=>{x.save();x.shadowColor=a[3];x.shadowBlur=12*dpr;text(a[2],a[0],a[1],.031,a[3]);x.restore()});
// Hong Kong red taxi silhouette
x.fillStyle='#d9dce2';rr([.20,.79,.60,.075],.025);x.fillStyle='#c92c36';rr([.23,.80,.54,.045],.012);x.fillStyle='#a8d7e8';rr([.34,.765,.30,.043],.012);x.fillStyle='#ffe7a0';x.fillRect(.22*W,.83*H,.045*W,.012*H);x.fillRect(.735*W,.83*H,.045*W,.012*H);x.fillStyle='#141820';[.33,.68].forEach(a=>{x.beginPath();x.arc(a*W,.87*H,9*dpr,0,Math.PI*2);x.fill()});text('的士',.5,.795,.018,'#fff');
}
function harbour(){x.fillStyle='#14253d';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H*.65);g.addColorStop(0,'#131d42');g.addColorStop(1,'#e17868');x.fillStyle=g;x.fillRect(0,0,W,H*.62); // skyline
[[.02,.31,.12],[.14,.42,.1],[.25,.25,.13],[.39,.49,.11],[.51,.34,.14],[.66,.47,.12],[.80,.30,.10],[.91,.4,.12]].forEach((b,i)=>{x.fillStyle=i%2?'#1b2b47':'#253452';x.fillRect(b[0]*W,(.62-b[1])*H,b[2]*W,b[1]*H);x.fillStyle='#ffd78a';for(let y=(.62-b[1])*H+8*dpr;y<.61*H;y+=13*dpr)x.fillRect(b[0]*W+6*dpr,y,4*dpr,5*dpr)});
// Victoria Harbour water reflections
x.fillStyle='#12334c';x.fillRect(0,.62*H,W,.38*H);for(let i=0;i<34;i++){x.fillStyle=i%3?'#f6b66b66':'#8de4e266';x.fillRect(((i*73)%W),(.64+(i%9)*.035)*H,(12+(i%5)*5)*dpr,2*dpr)}
// Star Ferry
x.fillStyle='#f6ead1';x.beginPath();x.moveTo(.37*W,.76*H);x.lineTo(.64*W,.76*H);x.lineTo(.60*W,.81*H);x.lineTo(.41*W,.81*H);x.fill();x.fillStyle='#2d756f';x.fillRect(.43*W,.72*H,.15*W,.04*H);x.fillStyle='#fff';for(let i=0;i<4;i++)x.fillRect((.445+i*.03)*W,.73*H,.012*W,.015*H);text('維多利亞港',.5,.18,.035,'#ffe8b0')}
function background(){stageNo=stageIndex();if(stageNo===2){harbour();return}skyline();if(stageNo>=3){ // Peak / Central skyline glow
let g=x.createRadialGradient(W*.5,H*.33,2,W*.5,H*.33,W*.65);g.addColorStop(0,'#ffb34755');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H)}
if(stageNo===0){ // dai pai dong red-white awning
x.fillStyle='#f6eee0';x.fillRect(0,.59*H,W,.07*H);for(let i=0;i<10;i++){x.fillStyle=i%2?'#f5eee2':'#d9413e';x.fillRect(i*W/10,.59*H,W/10,.07*H)}x.fillStyle='#46362e';x.fillRect(.07*W,.68*H,.86*W,.12*H);text('街頭魚蛋  $12',.5,.73,.027,'#ffe9b0')}
if(stageNo===1){ // tram front and neon bustle
x.fillStyle='#e3b94d';rr([.38,.69,.24,.22],.018);x.fillStyle='#233449';rr([.40,.71,.20,.08],.01);x.fillStyle='#cf4541';x.fillRect(.39*W,.81*H,.22*W,.045*H);text('叮叮車',.5,.695,.018,'#fff')}
}
function radius(){return Math.max(17,W*.048)*Math.max(.78,1-Math.max(0,stack.length-20)*.008)}
function Ball(type){this.type=type;this.r=radius();this.x=this.r+Math.random()*(W-this.r*2);this.y=-this.r-20*dpr;this.v=(H*(.20+Math.random()*.08)/60)*(1+Math.min(score,65)*.012);this.drift=score>=28?(Math.random()-.5)*1.6:0;this.seed=Math.random()*1000;this.rot=(Math.random()-.5)*.03}
function drawBall(b){let r=b.r, colors={normal:['#fff8df','#f7ca78','#c97928','#78320f'],gold:['#fffbd0','#ffe568','#efa600','#99520a'],spicy:['#ffe0d2','#ff7759','#dc321e','#761111'],frozen:['#effaff','#79d9ff','#178fc2','#104c80'],bomb:['#edf1f3','#91a3aa','#394b52','#17232b']};let q=colors[b.type]||colors.normal;x.save();x.translate(b.x,b.y);x.rotate(b.rot||0);
// soft contact shadow and rich spherical shading
x.beginPath();x.ellipse(r*.16,r*.35,r*.9,r*.67,0,0,Math.PI*2);x.fillStyle='#120c0866';x.fill();let gr=x.createRadialGradient(-r*.34,-r*.42,r*.04,r*.05,r*.05,r*1.12);gr.addColorStop(0,q[0]);gr.addColorStop(.24,q[1]);gr.addColorStop(.68,q[2]);gr.addColorStop(1,q[3]);x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fillStyle=gr;x.shadowColor='#080b12aa';x.shadowBlur=r*.24;x.shadowOffsetY=r*.12;x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
// toasted speckles, fixed per ball for natural cooked texture
for(let i=0;i<17;i++){let a=(i*2.399+b.seed)%6.28,rad=r*(.25+((i*37+b.seed)%61)/100);let sx=Math.cos(a)*rad,sy=Math.sin(a)*rad;if(sx*sx+sy*sy<r*r*.72){x.beginPath();x.arc(sx,sy,Math.max(1.1*dpr,r*(.018+(i%3)*.008)),0,Math.PI*2);x.fillStyle=i%3?'#6c351d55':'#fff0c966';x.fill()}}
// glossy highlight and warm rim
x.beginPath();x.ellipse(-r*.31,-r*.38,r*.28,r*.15,-.55,0,Math.PI*2);x.fillStyle='#fffde6aa';x.fill();x.beginPath();x.arc(0,0,r*.96,0,Math.PI*2);x.strokeStyle=b.type==='gold'?'#fff0a8':'#ffe3a355';x.lineWidth=Math.max(1.5*dpr,r*.035);x.stroke();if(b.type==='bomb'){x.fillStyle='#ff5a36';x.beginPath();x.arc(0,-r*.82,r*.12,0,Math.PI*2);x.fill()}x.restore()}
function spawnBall(){let types=['normal','normal','normal','normal','gold','spicy','frozen','bomb'];let t=score<8?(Math.random()<.08?'gold':'normal'):types[Math.floor(Math.random()*types.length)];balls.push(new Ball(t))}
function message(t,color='#fff'){ui.float.textContent=t;ui.float.style.color=color;ui.float.style.opacity=1;floatT=.7}
function updateUI(){ui.score.textContent=score;ui.stage.textContent=stages[stageIndex()].name;ui.combo.textContent='連擊 x'+combo;ui.best.textContent='最高 '+best;if(score>best){best=score;try{localStorage.setItem('fishball_best',best)}catch(e){}ui.best.textContent='最高 '+best}}
function finish(){running=false;over=true;$('#final').textContent=score+' cm';$('#rank').textContent='最高連擊 x'+maxCombo+'　·　'+stages[stageIndex()].name;$('#over').classList.remove('hidden')}
function start(){score=combo=maxCombo=0;balls=[];stack=[];bits=[];spawn=0;slow=fast=0;running=true;over=false;px=target=W/2;$('#start').classList.add('hidden');$('#over').classList.add('hidden');updateUI()}
function loop(t){let dt=Math.min(.05,(t-(last||t))/1000);last=t;if(running){if(slow>0)slow-=dt;if(fast>0)fast-=dt;if(floatT>0&&!(floatT-=dt))ui.float.style.opacity=0;ui.effect.style.display=slow>0||fast>0?'block':'none';ui.effect.textContent=slow>0?'慢鏡 '+slow.toFixed(1)+'s':'加速 '+fast.toFixed(1)+'s';spawn+=dt;if(spawn>Math.max(.48,1.7-score*.008)){spawn=0;spawnBall()}px+=(target-px)*Math.min(1,dt*12);for(let i=balls.length-1;i>=0;i--){let b=balls[i];b.y+=b.v*dt*60*(slow>0?.55:1)*(fast>0?1.3:1);b.x+=b.drift*dt*60;b.rot+=.02;let dx=b.x-px,dy=b.y-H*.62;if(Math.hypot(dx,dy)<b.r+20*dpr){balls.splice(i,1);if(b.type==='bomb'){score=Math.max(0,score-2);combo=0;message('炸彈！-2','#ff8a80')}else{stack.push(b);combo++;maxCombo=Math.max(maxCombo,combo);let add=(b.type==='gold'?3:1)+(Math.hypot(dx,dy)<b.r*.45?1:0);score+=Math.round(add*(combo>=15?2:combo>=10?1.5:combo>=5?1.25:1));if(b.type==='spicy')fast=3.5;if(b.type==='frozen')slow=3.5;message(b.type==='gold'?'金魚蛋！ +'+add:b.type==='spicy'?'辣！加速':b.type==='frozen'?'凍！慢鏡':'好嘢！ +'+add,b.type==='gold'?'#ffe082':'#fff')}updateUI()}else if(b.y-b.r>H+30){finish();break}}}
x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);background();balls.forEach(drawBall);
// skewer and caught fishballs
let tip=H*.62;x.save();x.strokeStyle='#c8a47a';x.lineWidth=Math.max(4,W*.012);x.lineCap='round';x.beginPath();x.moveTo(px,H*.91);x.lineTo(px,tip);x.stroke();x.strokeStyle='#f2d9a6';x.lineWidth=Math.max(1,W*.003);x.beginPath();x.moveTo(px-2*dpr,H*.88);x.lineTo(px-2*dpr,tip);x.stroke();stack.forEach((b,i)=>drawBall({type:b.type,r:radius()*.9,x:px,y:tip+(i+.65)*radius()*1.25,seed:b.seed,rot:0}));x.restore();requestAnimationFrame(loop)}
function pointer(e){let r=c.getBoundingClientRect();target=(e.clientX-r.left)*W/r.width}c.addEventListener('pointerdown',e=>{if(running){drag=true;pointer(e);c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(drag&&running)pointer(e)});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);let keys={};addEventListener('keydown',e=>{keys[e.key]=true;if((e.key===' '||e.key==='Enter')&&!running&&!over)start();if((e.key===' '||e.key==='Enter')&&over)start()});addEventListener('keyup',e=>keys[e.key]=false);function keyLoop(){if(running){if(keys.ArrowLeft||keys.a)target-=W*.025;if(keys.ArrowRight||keys.d)target+=W*.025;target=Math.max(20,Math.min(W-20,target))}requestAnimationFrame(keyLoop)}$('#startBtn').onclick=start;$('#again').onclick=start;requestAnimationFrame(loop);requestAnimationFrame(keyLoop)
})();
</script></body></html>
