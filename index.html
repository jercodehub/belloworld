<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Belloworld - Banana Rain</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fef08a;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .bello-btn {
      padding: 20px 45px;
      font-size: 2rem;
      font-weight: bold;
      color: #854d0e;
      background-color: #fde047;
      border: 4px solid #ca8a04;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      z-index: 10;
      user-select: none;
    }
    .bello-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
    }
    .banana {
      position: absolute;
      top: -60px;
      font-size: 2.5rem;
      pointer-events: none;
      animation: drop linear forwards;
      z-index: 5;
    }
    @keyframes drop {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>

  <button class="bello-btn" onclick="dropBananas()">Bello</button>

  <script>
    function dropBananas() {
      const count = Math.floor(Math.random() * 16) + 15; // 隨機產生 15 ~ 30 根香蕉
      for (let i = 0; i < count; i++) {
        createBanana();
      }
    }

    function createBanana() {
      const banana = document.createElement('div');
      banana.classList.add('banana');
      banana.innerText = '🍌';

      const startX = Math.random() * window.innerWidth;
      const duration = Math.random() * 1.5 + 1.5; // 掉落時間 1.5s ~ 3s
      const delay = Math.random() * 0.5;

      banana.style.left = `${startX}px`;
      banana.style.animationDuration = `${duration}s`;
      banana.style.animationDelay = `${delay}s`;

      document.body.appendChild(banana);

      setTimeout(() => {
        banana.remove();
      }, (duration + delay) * 1000);
    }
  </script>
</body>
</html>
