<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魚蛋接接樂 | Fish Ball Catcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body {
      background:#0a0a0a; display:flex; justify-content:center; align-items:center;
      min-height:100vh; font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
      overflow:hidden; touch-action:none;
    }
    #game-container {
      position:relative; width:100%; max-width:420px; aspect-ratio:9/16;
      background:#000; border-radius:14px; overflow:hidden;
      box-shadow:0 0 50px rgba(255,120,40,0.25);
    }
    canvas { display:block; width:100%; height:100%; }
    #ui-layer {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none; padding:14px; z-index:10;
    }
    .score-board {
      background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); border-radius:14px;
      padding:10px 16px; color:#fff; text-align:center;
      border:2px solid rgba(255,190,50,0.45); width:fit-content; margin:0 auto;
    }
    .score-board .label { font-size:12px; opacity:0.85; }
    .score-board .value {
      font-size:30px; font-weight:900; color:#ffd54f;
      text-shadow:0 2px 10px rgba(255,180,0,0.5); line-height:1.15;
    }
    .score-board .unit { font-size:13px; color:#ffecb3; }
    .height-info { font-size:12px; margin-top:3px; color:#9ee; opacity:0.95; }
    #start-screen, #gameover-screen {
      position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(25,12,5,0.94),rgba(45,18,5,0.96));
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      color:#fff; text-align:center; padding:24px; z-index:30; pointer-events:auto;
    }
    #start-screen h1 {
      font-size:40px; font-weight:900; color:#ffb300;
      text-shadow:0 4px 14px rgba(255,150,0,0.55); margin-bottom:6px; letter-spacing:2px;
    }
    #start-screen .subtitle { font-size:15px; color:#ffecb3; margin-bottom:26px; opacity:0.9; }
    .btn {
      background:linear-gradient(180deg,#ff9800,#e65100); color:#fff; border:none;
      padding:15px 46px; font-size:19px; font-weight:700; border-radius:50px; cursor:pointer;
      box-shadow:0 6px 22px rgba(255,100,0,0.5); font-family:inherit; letter-spacing:1px;
      transition:transform 0.12s;
    }
    .btn:active { transform:scale(0.96); }
    .howto {
      margin-top:28px; font-size:13.5px; line-height:1.7; color:#ddd; max-width:300px;
      background:rgba(255,255,255,0.07); padding:14px 18px; border-radius:12px;
    }
    #gameover-screen h2 {
      font-size:34px; color:#ff5252; margin-bottom:10px;
      text-shadow:0 0 18px rgba(255,50,50,0.45);
    }
    #gameover-screen .final-score { font-size:46px; font-weight:900; color:#ffd54f; margin:6px 0; }
    #gameover-screen .final-height { font-size:17px; color:#9ee; margin-bottom:26px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
      <div class="score-board">
        <div class="label">而家高度</div>
        <div class="value"><span id="scoreValue">0</span><span class="unit"> cm</span></div>
        <div class="height-info" id="heightDesc">香港小販攤檔</div>
      </div>
    </div>
    <div id="start-screen">
      <h1>魚蛋接接樂</h1>
      <div class="subtitle">用牙籤串住從天而降嘅魚蛋！</div>
      <button class="btn" id="startBtn">開始遊戲</button>
      <div class="howto">
        <strong>玩法：</strong><br>
        • 左右移動牙籤串住魚蛋<br>
        • 魚蛋會真係疊喺牙籤上<br>
        • 串得越多，魚蛋會自動縮小<br>
        • 漏接一粒就 GAME OVER<br>
        • 場景會一路向上變
      </div>
    </div>
    <div id="gameover-screen" class="hidden">
      <h2>魚蛋落地喇！</h2>
      <div>你串咗</div>
      <div class="final-score"><span id="finalScore">0</span> cm</div>
      <div class="final-height" id="finalHeight">到達：香港小販攤檔</div>
      <button class="btn" id="restartBtn">再嚟過</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const scoreValueEl = document.getElementById('scoreValue');
    const heightDescEl = document.getElementById('heightDesc');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHeightEl = document.getElementById('finalHeight');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W, H, dpr;
    let score = 0;
    let gameRunning = false;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let baseSpawnInterval = 1.5;
    let fallingBalls = [];
    let stackedBalls = [];
    let particles = [];
    let stickX = 0;
    let stickTargetX = 0;
    let isPointerDown = false;

    let transition = { active:false, progress:0, fromStage:null, toStage:null, duration:1.15 };
    let currentStageIndex = 0;

    const stages = [
      { min:0,   max:12,  name:'香港小販攤檔', key:'stall' },
      { min:12,  max:28,  name:'旺角街頭',     key:'street' },
      { min:28,  max:48,  name:'摩天大樓之間', key:'city' },
      { min:48,  max:75,  name:'高空雲層',     key:'clouds' },
      { min:75,  max:110, name:'接近平流層',   key:'stratosphere' },
      { min:110, max:160, name:'近地軌道',     key:'orbit' },
      { min:160, max:Infinity, name:'深空宇宙', key:'deepspace' }
    ];

    function getStageIndexByScore(s) {
      for (let i=0; i<stages.length; i++) {
        if (s >= stages[i].min && s < stages[i].max) return i;
      }
      return stages.length-1;
    }
    function getCurrentStage() { return stages[currentStageIndex]; }

    function getStackScale() {
      const n = stackedBalls.length;
      return Math.max(0.38, 1 - n * 0.045);
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.floor(rect.width * dpr);
      H = Math.floor(rect.height * dpr);
      canvas.width = W; canvas.height = H;
      canvas.style.width = rect.width+'px';
      canvas.style.height = rect.height+'px';
      stickX = W/2; stickTargetX = W/2;
    }
    window.addEventListener('resize', resize);
    resize();

    function getPointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }
    canvas.addEventListener('pointerdown', e => { if(!gameRunning)return; isPointerDown=true; stickTargetX=getPointerX(e); });
    canvas.addEventListener('pointermove', e => { if(!gameRunning||!isPointerDown)return; stickTargetX=getPointerX(e); });
    canvas.addEventListener('pointerup', () => isPointerDown=false);
    canvas.addEventListener('pointerleave', () => isPointerDown=false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); if(!gameRunning)return; isPointerDown=true; stickTargetX=getPointerX(e); }, {passive:false});
    canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!gameRunning)return; stickTargetX=getPointerX(e); }, {passive:false});
    canvas.addEventListener('touchend', () => isPointerDown=false);

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key]=true;
      if((e.key===' '||e.key==='Enter')&&!gameRunning&&!gameOver) startGame();
      if((e.key===' '||e.key==='Enter')&&gameOver) restartGame();
    });
    window.addEventListener('keyup', e => keys[e.key]=false);

    class Fishball {
      constructor(isStacked=false) {
        this.baseR = Math.max(18, W*0.048);
        this.r = this.baseR;
        this.x=0; this.y=0;
        this.rotation = Math.random()*Math.PI*2;
        this.rotSpeed = (Math.random()-0.5)*0.08;
        this.isStacked = isStacked;
        this.stackOffset = 0;
        this.wobble = Math.random()*Math.PI*2;
        this.wobbleSpeed = 0.07+Math.random()*0.05;
        this.sizeJitter = 0.92 + Math.random()*0.16;
        if(!isStacked) {
          this.x = this.r + Math.random()*(W-this.r*2);
          this.y = -this.r-20;
          const speedFactor = 1 + score*0.028;
          this.vy = (H*0.32 + Math.random()*H*0.14) * speedFactor / 60;
        }
      }
      update(dt) {
        if(!this.isStacked) {
          this.y += this.vy*dt*60;
          this.rotation += this.rotSpeed;
        } else {
          this.wobble += this.wobbleSpeed;
        }
      }
      draw(ctx, scale=1) {
        const r = this.baseR * this.sizeJitter * scale;
        ctx.save();
        ctx.translate(this.x, this.y);
        if(this.isStacked) ctx.rotate(Math.sin(this.wobble)*0.06);
        else ctx.rotate(this.rotation);

        ctx.beginPath();
        ctx.ellipse(r*0.12, r*0.18, r*0.88, r*0.68, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();

        const grad = ctx.createRadialGradient(-r*0.28, -r*0.32, r*0.05, 0, 0, r);
        grad.addColorStop(0,   '#fff3c4');
        grad.addColorStop(0.25,'#ffe082');
        grad.addColorStop(0.55,'#ffc04d');
        grad.addColorStop(0.82,'#e68a00');
        grad.addColorStop(1,   '#c43e00');
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(140,50,0,0.25)';
        ctx.lineWidth = r * 0.06;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(-r*0.28, -r*0.30, r*0.32, r*0.24, -0.4, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,240,0.55)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-r*0.12, -r*0.38, r*0.1, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fill();

        ctx.fillStyle = 'rgba(180,90,20,0.18)';
        for(let i=0; i<6; i++){
          const a = (i/6)*Math.PI*2 + 0.3 + this.rotation*0.2;
          const d = r * (0.35 + (i%3)*0.08);
          const sr = r * (0.05 + (i%2)*0.03);
          ctx.beginPath();
          ctx.arc(Math.cos(a)*d, Math.sin(a)*d, sr, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(160,70,10,0.12)';
        ctx.beginPath();
        ctx.ellipse(r*0.25, r*0.15, r*0.22, r*0.16, 0.5, 0, Math.PI*2);
        ctx.fill();

        if(this.isStacked){
          ctx.beginPath();
          ctx.arc(0, 0, r*0.14, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(50,20,5,0.6)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(-r*0.03, -r*0.03, r*0.06, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(80,40,15,0.4)';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    class Particle {
      constructor(x,y,color){
        this.x=x; this.y=y;
        this.vx=(Math.random()-0.5)*7;
        this.vy=(Math.random()-0.5)*7-2;
        this.life=1;
        this.decay=0.03+Math.random()*0.025;
        this.color=color;
        this.size=2.5+Math.random()*4.5;
      }
      update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.18; this.life-=this.decay; }
      draw(ctx){
        ctx.globalAlpha=Math.max(0,this.life);
        ctx.fillStyle=this.color;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size*this.life,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=1;
      }
    }

    function createCatchParticles(x,y){
      const colors=['#ffb74d','#ffd54f','#ffe082','#ff8a65','#fff59d'];
      for(let i=0;i<10;i++) particles.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)]));
    }

    function getStickGeometry(){
      const baseY = H - H*0.09;
      const scale = getStackScale();
      const ballR = Math.max(16, W*0.042) * scale;
      const stickLen = H*0.18 + stackedBalls.length * ballR * 1.7;
      const tipY = baseY - stickLen;
      return { baseY, stickLen, tipY, stickW: Math.max(5, W*0.013), scale };
    }

    function drawStick(){
      const { baseY, stickLen, tipY, stickW } = getStickGeometry();
      stickX += (stickTargetX - stickX)*0.25;
      stickX = Math.max(stickW*3, Math.min(W-stickW*3, stickX));

      ctx.save();
      ctx.translate(stickX, baseY);

      const grad = ctx.createLinearGradient(-stickW,0,stickW,0);
      grad.addColorStop(0,'#4e342e');
      grad.addColorStop(0.35,'#a1887f');
      grad.addColorStop(0.65,'#d7ccc8');
      grad.addColorStop(1,'#4e342e');

      ctx.beginPath();
      ctx.moveTo(-stickW*0.55,0);
      ctx.lineTo(-stickW*0.35,-stickLen);
      ctx.lineTo(stickW*0.35,-stickLen);
      ctx.lineTo(stickW*0.55,0);
      ctx.closePath();
      ctx.fillStyle=grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-stickW*0.35,-stickLen);
      ctx.lineTo(0,-stickLen-14);
      ctx.lineTo(stickW*0.35,-stickLen);
      ctx.closePath();
      ctx.fillStyle='#6d4c41';
      ctx.fill();

      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(-stickW*0.7,-10,stickW*1.4,16);
      ctx.restore();

      return { tipX:stickX, tipY:tipY-10, r:18 };
    }

    function drawStall(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const sky=ctx.createLinearGradient(0,0,0,H*0.48);
      sky.addColorStop(0,'#1a237e'); sky.addColorStop(0.55,'#3949ab'); sky.addColorStop(1,'#5c6bc0');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.48);
      const ground=ctx.createLinearGradient(0,H*0.42,0,H);
      ground.addColorStop(0,'#3e2723'); ground.addColorStop(1,'#1b0f0a');
      ctx.fillStyle=ground; ctx.fillRect(0,H*0.42,W,H*0.58);
      const awningY=H*0.40;
      const stripeW=W/10;
      for(let i=0;i<12;i++){
        ctx.fillStyle = i%2===0 ? '#c62828' : '#fafafa';
        ctx.fillRect(i*stripeW-8, awningY, stripeW+2, H*0.085);
      }
      ctx.fillStyle='#b71c1c';
      ctx.beginPath();
      ctx.moveTo(0, awningY+H*0.085);
      for(let i=0;i<=10;i++){
        const x=(i/10)*W;
        const y=awningY+H*0.085+(i%2===0?14:0);
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,awningY+H*0.17); ctx.lineTo(0,awningY+H*0.17);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#37474f';
      ctx.fillRect(W*0.07, H*0.56, W*0.86, H*0.22);
      ctx.fillStyle='#90a4ae';
      ctx.fillRect(W*0.07, H*0.56, W*0.86, H*0.032);
      for(let i=0;i<6;i++){
        const lx=W*(0.14+i*0.14);
        const ly=awningY+H*0.05;
        const glow=ctx.createRadialGradient(lx,ly,1,lx,ly,22);
        glow.addColorStop(0,'rgba(255,220,80,0.55)'); glow.addColorStop(1,'transparent');
        ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(lx,ly,22,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(lx,ly,6,0,Math.PI*2); ctx.fillStyle='#ffe082'; ctx.fill();
      }
      ctx.fillStyle='#fff8e1';
      ctx.fillRect(W*0.16, H*0.61, W*0.3, H*0.12);
      ctx.strokeStyle='#5d4037'; ctx.lineWidth=3;
      ctx.strokeRect(W*0.16, H*0.61, W*0.3, H*0.12);
      ctx.fillStyle='#5d4037';
      ctx.font = `${Math.floor(W*0.028)}px sans-serif`;
      ctx.fillText('魚蛋 $10', W*0.20, H*0.66);
      ctx.fillText('辣醬 加錢', W*0.20, H*0.70);
      ctx.fillStyle='#e53935'; ctx.fillRect(W*0.60, H*0.62, W*0.06, H*0.09);
      ctx.fillStyle='#43a047'; ctx.fillRect(W*0.69, H*0.62, W*0.06, H*0.09);
      ctx.fillStyle='#fb8c00'; ctx.fillRect(W*0.78, H*0.62, W*0.06, H*0.09);
      ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=2;
      for(let i=0;i<5;i++){
        ctx.beginPath(); ctx.moveTo(0,H*0.80+i*14); ctx.lineTo(W,H*0.80+i*14); ctx.stroke();
      }
      ctx.restore();
    }

    function drawStreet(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#0d1b2a'); g.addColorStop(0.5,'#1b2838'); g.addColorStop(1,'#2c3e50');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      const neons=[{x:0.08,y:0.22,c:'#ff1744',t:'茶餐廳'},{x:0.52,y:0.16,c:'#00e676',t:'魚蛋粉'},{x:0.28,y:0.32,c:'#ffea00',t:'燒味'}];
      neons.forEach(n=>{
        ctx.fillStyle=n.c; ctx.globalAlpha=alpha*0.75;
        ctx.font=`bold ${Math.floor(W*0.038)}px sans-serif`;
        ctx.shadowColor=n.c; ctx.shadowBlur=14;
        ctx.fillText(n.t, n.x*W, n.y*H);
        ctx.shadowBlur=0;
      });
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgba(10,15,25,0.85)';
      [[0,0.42,0.22],[0.2,0.32,0.18],[0.4,0.48,0.2],[0.6,0.3,0.16],[0.78,0.4,0.22]].forEach(([bx,bh,bw])=>{
        ctx.fillRect(bx*W, H-bh*H, bw*W, bh*H);
      });
      ctx.restore();
    }

    function drawCity(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#020617'); g.addColorStop(0.5,'#0f172a'); g.addColorStop(1,'#1e293b');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      const buildings=[[0.02,0.55,0.11],[0.14,0.4,0.1],[0.26,0.62,0.13],[0.4,0.35,0.1],[0.52,0.5,0.12],[0.66,0.3,0.09],[0.77,0.58,0.12],[0.9,0.42,0.1]];
      buildings.forEach(([bx,bh,bw],idx)=>{
        const x=bx*W, h=bh*H, w=bw*W;
        ctx.fillStyle=`rgba(15,25,45,${0.75+(idx%3)*0.08})`;
        ctx.fillRect(x,H-h,w,h);
        ctx.fillStyle='rgba(255,220,100,0.28)';
        for(let wy=H-h+14; wy<H-16; wy+=16){
          for(let wx=x+5; wx<x+w-5; wx+=12){
            if((wx+wy)%5!==0) ctx.fillRect(wx,wy,6,8);
          }
        }
      });
      ctx.restore();
    }

    function drawClouds(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#0c1445'); g.addColorStop(0.4,'#1a3a6e'); g.addColorStop(0.75,'#4a90c4'); g.addColorStop(1,'#87ceeb');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,255,255,0.22)';
      drawCloudShape(W*0.2,H*0.28,55);
      drawCloudShape(W*0.65,H*0.18,70);
      drawCloudShape(W*0.45,H*0.5,48);
      drawCloudShape(W*0.8,H*0.6,40);
      ctx.restore();
    }
    function drawCloudShape(x,y,s){
      ctx.beginPath();
      ctx.arc(x,y,s*0.5,0,Math.PI*2);
      ctx.arc(x+s*0.4,y-s*0.15,s*0.4,0,Math.PI*2);
      ctx.arc(x+s*0.7,y+s*0.05,s*0.35,0,Math.PI*2);
      ctx.arc(x-s*0.3,y+s*0.1,s*0.35,0,Math.PI*2);
      ctx.fill();
    }

    function drawStratosphere(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#000010'); g.addColorStop(0.35,'#0a1a40'); g.addColorStop(0.7,'#1a4a8a'); g.addColorStop(1,'#3a7ab5');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(200,220,255,0.08)';
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.ellipse(W*(0.2+i*0.2), H*(0.55+i*0.08), W*0.3, 18, 0,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawOrbit(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#000005'); g.addColorStop(0.6,'#050515'); g.addColorStop(1,'#0a1025');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';
      for(let i=0;i<90;i++){
        const sx=(i*97)%W, sy=(i*53)%H;
        ctx.globalAlpha=alpha*(0.35+(i%5)*0.12);
        ctx.beginPath(); ctx.arc(sx,sy,(i%3===0)?1.6:0.9,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=alpha;
      const earth=ctx.createRadialGradient(W/2,H+W*0.6,W*0.3,W/2,H+W*0.6,W*1.1);
      earth.addColorStop(0,'rgba(30,100,180,0.35)');
      earth.addColorStop(0.6,'rgba(20,60,120,0.15)');
      earth.addColorStop(1,'transparent');
      ctx.fillStyle=earth; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }

    function drawDeepSpace(alpha=1){
      ctx.save(); ctx.globalAlpha=alpha;
      ctx.fillStyle='#000008'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';
      for(let i=0;i<120;i++){
        const sx=(i*83)%W, sy=(i*47)%H;
        ctx.globalAlpha=alpha*(0.3+(i%6)*0.1);
        ctx.beginPath(); ctx.arc(sx,sy,(i%4===0)?1.8:0.8,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=alpha;
      const neb=ctx.createRadialGradient(W*0.75,H*0.3,5,W*0.75,H*0.3,W*0.45);
      neb.addColorStop(0,'rgba(140,50,200,0.28)');
      neb.addColorStop(0.5,'rgba(80,30,140,0.12)');
      neb.addColorStop(1,'transparent');
      ctx.fillStyle=neb; ctx.fillRect(0,0,W,H);
      const gal=ctx.createRadialGradient(W*0.2,H*0.7,2,W*0.2,H*0.7,40);
      gal.addColorStop(0,'rgba(255,220,180,0.25)'); gal.addColorStop(1,'transparent');
      ctx.fillStyle=gal; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }

    const bgDrawers = {
      stall:drawStall, street:drawStreet, city:drawCity, clouds:drawClouds,
      stratosphere:drawStratosphere, orbit:drawOrbit, deepspace:drawDeepSpace
    };

    function drawBackground(){
      if(transition.active){
        const fromKey=transition.fromStage.key;
        const toKey=transition.toStage.key;
        const p=transition.progress;
        const ease = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        bgDrawers[fromKey](1-ease);
        bgDrawers[toKey](ease);
        if(p>0.35 && p<0.65){
          const flash=1-Math.abs(p-0.5)*5;
          ctx.fillStyle=`rgba(255,240,200,${flash*0.12})`;
          ctx.fillRect(0,0,W,H);
        }
      } else {
        bgDrawers[getCurrentStage().key](1);
      }
    }

    function spawnFishball(){ fallingBalls.push(new Fishball(false)); }

    function checkCollision(ball, tip){
      const dx=ball.x-tip.tipX, dy=ball.y-tip.tipY;
      const r = ball.baseR * ball.sizeJitter;
      return Math.sqrt(dx*dx+dy*dy) < r + tip.r*0.7;
    }

    function skewerBall(ball){
      const stacked = new Fishball(true);
      stacked.baseR = ball.baseR;
      stacked.sizeJitter = ball.sizeJitter;
      stacked.rotation = ball.rotation;
      stackedBalls.push(stacked);
      createCatchParticles(ball.x, ball.y);
      score += 1;
      updateUI();
      checkStageTransition();
    }

    function updateStackedPositions(tipY, scale){
      const spacing = Math.max(16, W*0.042) * scale * 1.65;
      stackedBalls.forEach((b, i) => {
        b.x = stickX;
        b.y = tipY + (i + 0.5) * spacing;
      });
    }

    function checkStageTransition(){
      const newIndex = getStageIndexByScore(score);
      if(newIndex !== currentStageIndex && !transition.active){
        transition.active = true;
        transition.progress = 0;
        transition.fromStage = stages[currentStageIndex];
        transition.toStage = stages[newIndex];
        currentStageIndex = newIndex;
      }
    }

    function update(dt){
      if(!gameRunning) return;

      if(keys['ArrowLeft']||keys['a']||keys['A']) stickTargetX = Math.max(40, stickTargetX - W*0.022);
      if(keys['ArrowRight']||keys['d']||keys['D']) stickTargetX = Math.min(W-40, stickTargetX + W*0.022);

      if(transition.active){
        transition.progress += dt / transition.duration;
        if(transition.progress >= 1){ transition.progress=1; transition.active=false; }
      }

      spawnTimer += dt;
      const interval = Math.max(0.42, baseSpawnInterval - score*0.011);
      if(spawnTimer >= interval){ spawnTimer=0; spawnFishball(); }

      stickX += (stickTargetX - stickX)*0.25;
      stickX = Math.max(30, Math.min(W-30, stickX));

      const geo = getStickGeometry();
      const tip = { tipX:stickX, tipY:geo.tipY-8, r:16 };

      for(let i=fallingBalls.length-1; i>=0; i--){
        const b = fallingBalls[i];
        b.update(dt);
        if(checkCollision(b, tip)){
          skewerBall(b);
          fallingBalls.splice(i,1);
          continue;
        }
        if(b.y - b.baseR > H+30){ endGame(); return; }
      }

      updateStackedPositions(geo.tipY, geo.scale);
      stackedBalls.forEach(b => b.update(dt));

      for(let i=particles.length-1; i>=0; i--){
        particles[i].update();
        if(particles[i].life <= 0) particles.splice(i,1);
      }
    }

    function updateUI(){
      scoreValueEl.textContent = score;
      heightDescEl.textContent = getCurrentStage().name;
    }

    function draw(){
      drawBackground();
      fallingBalls.forEach(b => b.draw(ctx, 1));
      drawStick();
      const scale = getStackScale();
      stackedBalls.forEach(b => b.draw(ctx, scale));
      particles.forEach(p => p.draw(ctx));
    }

    function gameLoop(timestamp){
      if(!lastTime) lastTime=timestamp;
      const dt = Math.min(0.05, (timestamp-lastTime)/1000);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame(){
      score=0; fallingBalls=[]; stackedBalls=[]; particles=[];
      spawnTimer=0; gameRunning=true; gameOver=false;
      currentStageIndex=0; transition.active=false;
      stickX=W/2; stickTargetX=W/2;
      updateUI();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
    }
    function endGame(){
      gameRunning=false; gameOver=true;
      finalScoreEl.textContent=score;
      finalHeightEl.textContent='到達：'+getCurrentStage().name;
      gameoverScreen.classList.remove('hidden');
    }
    function restartGame(){ startGame(); }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
